# Netlify build configuration for the AKAY catalogue at akay.ie.
# Netlify auto-detects Astro, but pinning it here keeps builds reproducible.
# Set AIRTABLE_TOKEN (and optionally AIRTABLE_BASE_ID) in the Netlify UI:
#   Site settings → Environment variables. Build-time only; never shipped to the browser.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Domain migration: offers.akay.ie → akay.ie
#
# The catalogue used to live at offers.akay.ie and every path is unchanged, so
# each old URL maps 1:1 onto the same path on the apex domain. Without these
# 301s the ranking and links earned by the old host are simply lost, and both
# hosts serve identical HTML — duplicate content Google has to pick between.
#
# These rules only fire for requests that actually reach this Netlify site, so
# offers.akay.ie must stay attached to the site as a domain alias (Site
# configuration → Domain management) with its DNS still pointing at Netlify.
# Keep it attached for at least 12 months so the signals fully transfer.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://offers.akay.ie/*"
  to = "https://akay.ie/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://offers.akay.ie/*"
  to = "https://akay.ie/:splat"
  status = 301
  force = true

# One canonical host. Netlify also does this when akay.ie is the primary
# domain, but stating it here means the behaviour survives a settings change.
[[redirects]]
  from = "https://www.akay.ie/*"
  to = "https://akay.ie/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.akay.ie/*"
  to = "https://akay.ie/:splat"
  status = 301
  force = true

# The old site linked its guides from a homepage anchor; a few external links
# use /guides without a slug. Send them to the real hub page.
[[redirects]]
  from = "/guide/*"
  to = "/guides/:splat"
  status = 301

# ---------------------------------------------------------------------------
# URLs from earlier sites on akay.ie that Google still has indexed.
#
# Search Console (2026-09) still shows impressions for these, all of which
# 404 on the Astro site: /contact-us/ alone had 255 impressions at an average
# position of 3.4 over 90 days. Send each to the closest live page so the
# ranking transfers instead of dropping out of the index.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/contact-us/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact/*"
  to = "/about/"
  status = 301

# The old WordPress install's dated posts (/2023/10/15/hello-world/).
[[redirects]]
  from = "/2023/*"
  to = "/"
  status = 301

# Category renamed "Other" -> "Other FMCG" -> "Household" (2026-10-02).
# Every Other FMCG record was moved to Household in Airtable, so the
# other-fmcg page is no longer generated. force = true so a stray page at
# either old path can never shadow the redirect.
[[redirects]]
  from = "/category/other/*"
  to = "/category/household/"
  status = 301
  force = true

[[redirects]]
  from = "/category/other-fmcg/*"
  to = "/category/household/"
  status = 301
  force = true

# Brand pages that carried a "-2" suffix before brand spellings were merged
# on 2026-09-29. src/lib/redirects.mjs maps the ones the current catalogue can
# still derive; these two dropped out of it before the change shipped.
[[redirects]]
  from = "/brands/dove-wholesale-2/*"
  to = "/brands/dove-wholesale/"
  status = 301

[[redirects]]
  from = "/brands/jw-wholesale-2/*"
  to = "/brands/jw-wholesale/"
  status = 301

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------

# Long-cache the immutable hashed assets and the logo.
[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/akay-bird.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og-akay.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The launch email's thumbnail and its still. Mail clients and their image
# proxies refetch these for as long as the send keeps being opened, so they
# get the same day-long cache as the other committed images rather than the
# must-revalidate the catalogue pages need.
[[headers]]
  for = "/instant-quote-preview.gif"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/instant-quote-preview.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The client-side search index is rebuilt on every deploy (at most every 5
# minutes). Short cache so buyers see fresh prices, with stale-while-revalidate
# so a repeat search never waits on the network.
[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

# The catalogue is re-baked from Airtable every 5 minutes, so pages must not
# be cached long at the edge — but they can be revalidated cheaply.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # No includeSubDomains: other akay.ie subdomains are outside this site's
    # control and would be forced to HTTPS by a header set here.
    Strict-Transport-Security = "max-age=31536000"

# Internal email-signature HTML. robots.txt disallows crawling it; this header
# also keeps it out of the index if it is ever linked from elsewhere.
[[headers]]
  for = "/sig/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
