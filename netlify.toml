# Netlify build configuration for the AKAY offers catalogue.
# Netlify auto-detects Astro, but pinning it here keeps builds reproducible.
# Set AIRTABLE_TOKEN (and optionally AIRTABLE_BASE_ID) in the Netlify UI:
#   Site settings → Environment variables. Build-time only; never shipped to the browser.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# The trade assistant. The site itself is static; this is the only server-side
# piece, and it exists so the Anthropic key never reaches the browser. It is
# reachable at /api/chat (declared in the function's own `config.path`).
# Set ANTHROPIC_API_KEY and AKAY_QUOTE_WEBHOOK_URL in Site settings ->
# Environment variables.
[functions]
  node_bundler = "esbuild"

# Long-cache the immutable hashed assets and the logo.
[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/akay-bird.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The assistant's search index — rebuilt on every deploy, so keep it short-lived.
[[headers]]
  for = "/offers-index.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
